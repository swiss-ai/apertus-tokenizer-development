name: Token runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install ruff==0.17.1
      - run: ruff check tokenization_scripts/preprocess_megatron.py tests/test_tokenization_scripts.py
      - run: ruff format --check tokenization_scripts/preprocess_megatron.py tests/test_tokenization_scripts.py
      - name: Check retained historical config facts
        run: python -m unittest discover -s tests -p test_codealchemy_configs.py

  paired-source:
    # Private source must never be exposed to untrusted fork proposal code.
    if: ${{ vars.DPP_INTEGRATION_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Require owner-provided read-only private DPP access
        env:
          DPP_READ_TOKEN: ${{ secrets.DPP_READ_TOKEN }}
        run: test -n "$DPP_READ_TOKEN"
      - name: Read exact paired revision
        id: pin
        run: |
          revision=$(cat tokenization_scripts/dpp-revision.txt)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: swiss-ai/data-pipeline-pretrain
          ref: ${{ steps.pin.outputs.revision }}
          token: ${{ secrets.DPP_READ_TOKEN }}
          path: dpp
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public source-test prerequisites
        run: python -m pip install -r tests/requirements/runtime.txt
      - name: Check typed producer interface and owning workflow
        env:
          PYTHONPATH: dpp/src
          MYPYPATH: dpp/src
        run: |
          python -m mypy --config-file pyproject.toml
          python -m pytest -q
