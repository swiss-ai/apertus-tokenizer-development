name: Token runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install ruff==0.17.1
      - run: ruff check tokenization_scripts/preprocess_megatron.py tests/test_tokenization_scripts.py
      - run: ruff format --check tokenization_scripts/preprocess_megatron.py tests/test_tokenization_scripts.py

  paired-source:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Check private dependency access
        id: access
        env:
          DPP_READ_TOKEN: ${{ secrets.DPP_READ_TOKEN }}
        run: |
          if [ -n "$DPP_READ_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Paired integration skipped: an owner-provided DPP_READ_TOKEN with read access to private swiss-ai/data-pipeline-pretrain is required." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read exact paired revision
        if: steps.access.outputs.available == 'true'
        id: pin
        run: echo "revision=$(cat tokenization_scripts/dpp-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.access.outputs.available == 'true'
        with:
          repository: swiss-ai/data-pipeline-pretrain
          ref: ${{ steps.pin.outputs.revision }}
          token: ${{ secrets.DPP_READ_TOKEN }}
          path: dpp
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.access.outputs.available == 'true'
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public source-test prerequisites
        if: steps.access.outputs.available == 'true'
        run: python -m pip install -r tests/requirements/runtime.txt
      - name: Check typed producer interface and owning workflow
        if: steps.access.outputs.available == 'true'
        env:
          PYTHONPATH: dpp/src
          MYPYPATH: dpp/src
        run: |
          python -m mypy --config-file pyproject.toml
          python -m pytest -q
