[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
files = ["tokenization_scripts/tokenize.py", "tokenization_scripts/slurm.py"]
python_version = "3.10"
# Resolve tokenization_scripts as a namespace package from the repository root.
explicit_package_bases = true
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# These external modules have incomplete or absent type stubs.
module = [
    "datatrove.*",
    "pyarrow.*",
    "tokenizers.*",
]
ignore_missing_imports = true
