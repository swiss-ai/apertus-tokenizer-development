# Retained producer output only; sibling removed/robots is excluded by the input root.
# Distinct token release; the historical broad-root configuration stays immutable.
TOKENIZER=../preliminary_mul_200k/tokenizer.json
TOKENIZER_NAME=preliminary_mul_200k
DATASET_NAME=dclm-edu-retained-output-v1
COLUMN_KEY=text
PATH_TO_RAW_DATASET=/capstor/store/cscs/swissai/infra01/datasets/dclm-edu_spp_annotated_robots_v2/data/data/output
PATH_TO_PREPROCESSING_METADATA=/capstor/store/cscs/swissai/infra01/datasets_tokenized/dclm-edu-retained-output-v1_apertus_v2 # Where dumps are stored
PATH_TO_OUTPUT_FOLDER=/capstor/store/cscs/swissai/infra01/datasets_tokenized/dclm-edu-retained-output-v1_apertus_v2          # Where outputs are saved
DUMPS_NUMBER=1642
REHYDRATE_FLAG=False
EXTENSION=.parquet

# datatrove config
NUMBER_OF_DATATROVE_TASKS=1

# slurm config
ACCOUNT=infra01
NODES=1
GPUS=4
CPUS_PER_TASK=288
NO_REQUEUE="--no-requeue"
TIME=1:00:00
PARTITION=normal
