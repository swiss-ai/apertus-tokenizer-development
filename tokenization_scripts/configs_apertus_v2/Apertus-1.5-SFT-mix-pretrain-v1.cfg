# Plaintext documents produced by data-pipeline-pretrain's
# pipelines/apertus-sft-pretrain materializer. The renderer emits body-only
# text; MegatronDocumentTokenizer adds one BOS (ID 1) and EOS (ID 2).
TOKENIZER=../preliminary_mul_200k/tokenizer.json
TOKENIZER_NAME=preliminary_mul_200k
DATASET_NAME=apertus-1.5-sft-pretrain-v1
COLUMN_KEY=text

# This path must point at the accepted `data/` directory. The sibling
# `rejected/` decision ledger is intentionally not tokenized.
PATH_TO_RAW_DATASET=/capstor/store/cscs/swissai/infra01/datasets/Apertus-1.5-SFT-mix-pretrain-v1/data
PATH_TO_PREPROCESSING_METADATA=/capstor/store/cscs/swissai/infra01/datasets_tokenized/Apertus-1.5-SFT-mix-pretrain-v1_apertus_v2
PATH_TO_OUTPUT_FOLDER=/capstor/store/cscs/swissai/infra01/datasets_tokenized/Apertus-1.5-SFT-mix-pretrain-v1_apertus_v2
DUMPS_NUMBER=8
REHYDRATE_FLAG=False
EXTENSION=.parquet

# Datatrove config. The materializer emits 102 independent Parquet parts; each
# dump can therefore fan out over several reader/tokenizer tasks.
NUMBER_OF_DATATROVE_TASKS=16

# Slurm config
ACCOUNT=infra01
NODES=1
GPUS=4
CPUS_PER_TASK=288
NO_REQUEUE="--no-requeue"
TIME=02:00:00
RESERVATION=SD-69241-apertus-1-5-0
PARTITION=normal
