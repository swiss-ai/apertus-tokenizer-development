TOKENIZER=../preliminary_mul_200k/tokenizer.json
TOKENIZER_NAME=preliminary_mul_200k
DATASET_NAME=open-papers-source-order-no-references
COLUMN_KEY=text
ID_COLUMN=id

PATH_TO_RAW_DATASET=/mloscratch/open-papers-no-references/text
PATH_TO_OUTPUT_FOLDER=/mloscratch/open-papers-no-references/tokens
PATH_TO_PREPROCESSING_METADATA=$PATH_TO_OUTPUT_FOLDER/tokenization-metadata
DATASET_OUTPUT_FOLDER_NAME=$PATH_TO_OUTPUT_FOLDER/$TOKENIZER_NAME

REQUIRED_DATASET_MARKER=$PATH_TO_RAW_DATASET/_SUCCESS.json
DATASET_MANIFEST=$PATH_TO_RAW_DATASET/examples_manifest.jsonl
MANIFEST_PATH_KEY=relative_path
DUMP_GROUP_FIELDS=source
EXPECTED_GROUP_COUNT=5
EXPECTED_GROUP_HEADS=arxiv,copernicus,pmc,redalyc,scielo
MAX_DUMP_BYTES=20000000000

# Nothing is truncated: whole papers, and the writer ran uncapped. This is the
# upper bound the artifact demonstrably satisfies, so validation can enforce it.
# The longest sequence in the corpus is an arXiv paper at 2,302,799 tokens.
MAX_SEQUENCE_TOKENS=2400000

REHYDRATE_FLAG=False
EXTENSION=.parquet
NUMBER_OF_DATATROVE_TASKS=64
TOKENIZER_BATCH_SIZE=1000
TOKENIZATION_VALIDATION_WORKERS=16
TOKENIZATION_VALIDATION_MODE=lightweight_infrastructure

ACCOUNT=infra01
NODES=1
PARTITION=normal
TIME=12:00:00
CPUS_PER_TASK=64
GPUS=0
NO_REQUEUE=--no-requeue
