DATASET_OUTPUT_FOLDER_NAME=$PATH_TO_OUTPUT_FOLDER/$TOKENIZER_NAME/$DATASET_NAME
REQUIRED_DATASET_MARKER=$PATH_TO_RAW_DATASET/_SUCCESS.json
