TOKENIZER_BATCH_SIZE=128
TOKENIZER_BATCH_BYTES=33554432
TOKENIZATION_VALIDATION_WORKERS=4
TOKENIZATION_VALIDATION_MODE=strict
ACCOUNT=infra01
NODES=1
GPUS=0
CPUS_PER_TASK=16
NO_REQUEUE=--no-requeue
PARTITION=normal
TIME=02:00:00
TOKENIZATION_LAUNCH_BACKEND=rcp
