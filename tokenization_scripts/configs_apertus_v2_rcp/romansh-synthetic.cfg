# Pinned Romansh release c2f3a672246aedfac6733e49bfba18851eab8b3a.
# RCP mounts the scratch PVC at these canonical paths; maps remain valid on Clariden.
TOKENIZER=../preliminary_mul_200k/tokenizer.json
TOKENIZER_NAME=preliminary_mul_200k
DATASET_NAME=romansh-synthetic
COLUMN_KEY=text
ID_COLUMN=source_key
PATH_TO_RAW_DATASET=/capstor/store/cscs/swissai/infra01/datasets/apertus-pretrain-romansh-v1/synthetic
TOKEN_MAP_SOURCE_ROOT=$PATH_TO_RAW_DATASET
PATH_TO_OUTPUT_FOLDER=/capstor/store/cscs/swissai/infra01/datasets_tokenized/apertus-pretrain-romansh-v1_apertus_v2
